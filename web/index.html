<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aloud</title>
  <meta name="description" content="Turn your own study material into a teacher that explains it out loud, asks you questions, and listens to your answers.">
  <meta name="theme-color" content="#efefea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171a21" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Resolves light/dark before first paint. Must stay synchronous and
       above the stylesheets, or dark-mode users get a white flash. -->
  <script src="/js/theme.js"></script>

  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon.svg">

  <link rel="preload" href="/assets/fonts/figtree-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/newsreader-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="stylesheet" href="/styles/landing.css">
  <link rel="stylesheet" href="/styles/player.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="app">
    <!-- Replaced on first render. Shown while the module graph loads, so the
         first paint is a calm holding state rather than a blank page. -->
    <div class="boot" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
        <path d="M12 5.5v13M8 8.2v7.6M16 8.2v7.6M4.6 10.6v2.8M19.4 10.6v2.8"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      </svg>
      <p>Aloud</p>
    </div>
  </div>

  <!-- The player lives outside #app so navigation never interrupts narration. -->
  <div id="player-layer"></div>

  <noscript>
    <div class="boot-noscript">
      <h1>Aloud needs JavaScript</h1>
      <p>This app speaks lessons aloud and listens to your answers, which the browser
         cannot do without scripts. Enable JavaScript and reload.</p>
    </div>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
